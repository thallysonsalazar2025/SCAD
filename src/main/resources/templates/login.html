<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Gestão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f5f5;
        }
        .login-container {
            height: 100vh;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .logo {
            width: 150px; /* Aumentei um pouco para dar mais destaque */
            height: auto;
            margin-bottom: 30px; /* Mais espaço abaixo da logo */
            object-fit: contain;
        }
    </style>
</head>
<body>

<div class="container-fluid login-container">
    <div class="row h-100">

        <!-- Formulário -->
        <div class="col-md-4 d-flex justify-content-center align-items-center">
            <div class="login-box w-100">

                <div class="text-center">
                    <!-- Apenas a imagem -->
                    <img th:src="@{/images/logo.jpeg}" class="logo" alt="Logo do Sistema">
                    <!-- O TÍTULO FOI REMOVIDO -->
                </div>

                <!-- Bloco para exibir mensagens de erro ou sucesso -->
                <div th:if="${param.error == 'true'}" class="alert alert-danger" role="alert">
                    Usuário ou senha inválidos.
                </div>
                <div th:if="${param.logout == 'true'}" class="alert alert-success" role="alert">
                    Você foi desconectado com sucesso.
                </div>

                <form method="post" th:action="@{/login}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuário</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Digite seu usuario" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Digite sua senha" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mt-3">Entrar</button>
                </form>

                <div class="d-flex align-items-center my-4">
                    <hr class="flex-grow-1">
                    <span class="px-3 text-muted">ou</span>
                    <hr class="flex-grow-1">
                </div>

                <a th:href="@{/oauth2/authorization/google}" class="btn btn-outline-primary w-100">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google logo" style="width: 20px; margin-right: 10px;">
                    Entrar com Google
                </a>
            </div>
        </div>

        <!-- Carrossel -->
        <div class="col-md-8 d-none d-md-block p-0" style="overflow: hidden;">
            <div id="carouselLivraria" class="carousel slide carousel-fade h-100" data-bs-ride="carousel">
                <div class="carousel-inner h-100">

                    <div class="carousel-item active h-100">
                        <img src="https://gestaoflex.com.br/imgb/o-sistema-pdv-e-sua-importancia-na-gestao-de-caixa-e-estoque.jpeg"
                             class="d-block w-100 h-100" style="object-fit: cover;" alt="Gestão de Estoque">
                    </div>

                    <div class="carousel-item h-100">
                        <img src="https://boico.com.br/wp-content/uploads/2023/12/crm-customer-relationship-management-para-conceito-de-sistema-de-marketing-de-vendas-de-negocios_31965-13457-e1706630198262.jpg"
                             class="d-block w-100 h-100" style="object-fit: cover;" alt="Relacionamento com Cliente (CRM)">
                    </div>

                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
