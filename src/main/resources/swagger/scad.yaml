openapi: 3.0.3
info:
  title: Biblioteca Digital API
  description: API para o cadastro de autores e livros na Biblioteca Digital.
  version: 1.0.0

tags:
  - name: Autores
    description: Operações relacionadas a autores
  - name: Usuários
    description: Operações relacionadas a usuários
  - name: Livros
    description: Operações relacionadas a livros

paths:
  /autores:
    post:
      tags:
        - Autores
      summary: Cadastra um novo autor
      operationId: registerAuthor
      requestBody:
        description: Objeto com os dados do autor a ser criado.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutorRequest'
        required: true
      responses:
        '201':
          description: Autor cadastrado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorResponse'
        '400':
          description: Requisição inválida.
        '422':
          description: Erro de validação.
        default:
          description: Erro inesperado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags:
        - Autores
      summary: Lista autores com filtros opcionais
      operationId: getAllAuthors
      parameters:
        - name: nacionalityCountry
          in: query
          description: Filtra autores pelo país de nacionalidade.
          required: false
          schema:
            type: string
            example: Brasil
        - name: name
          in: query
          description: Filtra autores cujo nome contém o valor fornecido.
          required: false
          schema:
            type: string
            example: Maria
      responses:
        '200':
          description: Lista de autores retornada com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AutorResponse'
        default:
          description: Erro inesperado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /autores/{id}:
    parameters:
      - name: id
        in: path
        description: ID do autor.
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags:
        - Autores
      summary: Retorna um autor específico
      operationId: getAuthorById
      responses:
        '200':
          description: Autor encontrado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutorResponse'
        '404':
          description: Autor não encontrado.
        default:
          description: Erro inesperado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - Autores
      summary: Atualiza os dados de um autor
      operationId: updateAuthor
      requestBody:
        description: Objeto com os dados do autor a ser atualizado.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutorRequest'
      responses:
        '200':
          description: Autor atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutorResponse'
        '404':
          description: Autor não encontrado.
        '422':
          description: Erro de validação.
        default:
          description: Erro inesperado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Autores
      summary: Deleta um autor
      operationId: deleteAuthor
      responses:
        '204':
          description: Autor deletado com sucesso.
        '404':
          description: Autor não encontrado.
        default:
          description: Erro inesperado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users:
    post:
      tags:
        - Usuários
      summary: Cadastra um novo usuário
      operationId: registerUser
      description: Cria um novo usuário no sistema. A senha deve ter no mínimo 6 caracteres.
      requestBody:
        description: Objeto com os dados do usuário a ser criado.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
      responses:
        '201':
          description: Usuário cadastrado com sucesso. O Header 'Location' conterá a URL para o novo usuário.
        '400':
          description: "Requisição inválida  JSON mal formatado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '422':
          description: "Erro de validação campo obrigatório faltando, CPF já existente"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books:
    post:
      tags:
        - Livros
      summary: Cadastra um novo livro
      operationId: registerBook
      requestBody:
        description: Objeto com os dados do livro a ser criado.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
        required: true
      responses:
        '201':
          description: Livro cadastrado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '400':
          description: Requisição inválida.
        '422':
          description: Erro de validação.
        default:
          description: Erro inesperado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags:
        - Livros
      summary: Lista livros de forma paginada com filtros opcionais
      operationId: getAllBooks
      parameters:
        - name: title
          in: query
          description: Filtra livros pelo título.
          required: false
          schema:
            type: string
            example: Dom Casmurro
        - name: isbn
          in: query
          description: Filtra livros pelo ISBN.
          required: false
          schema:
            type: string
            example: 978-85-359-0277-X
        - name: datePublisher
          in: query
          description: Filtra livros pela data de publicação.
          required: false
          schema:
            type: string
            format: date
            example: "1899-03-15"
        - name: page
          in: query
          description: "Número da página (começando em 0)."
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          description: "Quantidade de elementos por página."
          required: false
          schema:
            type: integer
            format: int32
            default: 10
        - name: sort
          in: query
          description: "Critério de ordenação no formato: propriedade,(asc|desc). Suporte para múltiplas propriedades."
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
            example: title,asc
      responses:
        '200':
          description: Lista paginada de livros retornada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookPage'
        default:
          description: Erro inesperado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/{id}:
    parameters:
      - name: id
        in: path
        description: ID do livro.
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags:
        - Livros
      summary: Retorna um livro específico
      operationId: getBookById
      responses:
        '200':
          description: Livro encontrado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '404':
          description: Livro não encontrado.
        default:
          description: Erro inesperado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - Livros
      summary: Atualiza os dados de um livro
      operationId: updateBook
      requestBody:
        description: Objeto com os dados do livro a ser atualizado.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
      responses:
        '200':
          description: Livro atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '404':
          description: Livro não encontrado.
        '422':
          description: Erro de validação.
        default:
          description: Erro inesperado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Livros
      summary: Deleta um livro
      operationId: deleteBook
      responses:
        '204':
          description: Livro deletado com sucesso.
        '404':
          description: Livro não encontrado.
        default:
          description: Erro inesperado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    # === Schemas de Autor ===
    AutorRequest:
      type: object
      required:
        - name
        - dateBirth
        - nacionalityCountry
      properties:
        name:
          type: string
          description: Nome completo do autor.
          example: "Machado de Assis"
        dateBirth:
          type: string
          format: date
          description: Data de nascimento do autor.
          example: "1839-06-21"
        nacionalityCountry:
          type: string
          description: País de nacionalidade do autor.
          example: "Brasil"

    AutorResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: ID único do autor.
          example: 101
        name:
          type: string
          example: "Machado de Assis"
        dateBirth:
          type: string
          format: date
          example: "1839-06-21"
        nacionalityCountry:
          type: string
          example: "Brasil"
        books:
          type: array
          items:
            $ref: '#/components/schemas/BookResponse'

    AuthorResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: ID único do autor.
          example: 101
        name:
          type: string
          example: "Machado de Assis"
        dateBirth:
          type: string
          format: date
          example: "1839-06-21"
        nacionalityCountry:
          type: string
          example: "Brasil"


    # === Schemas de Usuário ===
    UserRegistrationRequest:
      type: object
      description: Schema para o cadastro de um novo usuário.
      required:
        - name
        - cpf
        - login
        - password
        - roles
        - dateInclusion
        - dateUpdated
      properties:
        name:
          type: string
          description: Nome completo do usuário.
          example: "Ana da Silva"
        cpf:
          type: string
          description: CPF do usuário (deve ser único).
          example: "123.456.789-00"
        login:
          type: string
          description: Login de acesso do usuário (deve ser único).
          example: "ana.silva"
        password:
          type: string
          format: password
          description: Senha de acesso do usuário.
          minLength: 6
          example: "senhaForte123"
        roles:
          type: array
          description: Lista de perfis (roles) do usuário.
          items:
            type: string
          example: ["ROLE_USER", "ROLE_READER"]
        dateInclusion:
          type: string
          format: date
          description: Data de inclusão do usuário.
        dateUpdated:
          type: string
          format: date
          description: Data de atualização do usuário.



    UserResponse:
      type: object
      description: Schema para a resposta de dados de um usuário.
      properties:
        id:
          type: integer
          format: int64
          description: ID único do usuário.
        # Adicionar outros campos que você queira retornar em GETs, como nome, login, etc.
        dateInclusion:
          type: string
          format: date
          description: Data de inclusão do usuário.
        dateUpdated:
          type: string
          format: date
          description: Data de atualização do usuário.

    # === Schemas de Livro ===
    BookRequest:
      type: object
      required:
        - title
        - isbn
        - datePublisher
        - authorId
        - price
        - genre
      properties:
        title:
          type: string
          description: Título do livro.
          example: "Dom Casmurro"
        isbn:
          type: string
          description: ISBN do livro.
          example: "978-85-359-0277-X"
        datePublisher:
          type: string
          format: date
          description: Data de publicação do livro.
          example: "1899-03-15"
        authorId:
          type: integer
          format: int64
          description: ID do autor do livro.
          example: 101
        price:
          type: number
          format: double
          description: Preço do livro.
          example: 45.90
        genre:
          $ref: '#/components/schemas/Genre'

    BookResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: ID único do livro.
          example: 201
        title:
          type: string
          example: "Dom Casmurro"
        isbn:
          type: string
          example: "978-85-359-0277-X"
        datePublisher:
          type: string
          format: date
          example: "1899-03-15"
        price:
          type: number
          format: double
          example: 45.90
        genre:
          $ref: '#/components/schemas/Genre'
        author:
          $ref: '#/components/schemas/AutorWhithBooksResponse'


    AutorWhithBooksResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: ID único do autor.
          example: 101
        name:
          type: string
          example: "Machado de Assis"
        dateBirth:
          type: string
          format: date
          example: "1839-06-21"
        nacionalityCountry:
          type: string
          example: "Brasil"

    Genre:
      type: string
      description: Gênero literário do livro.
      enum:
        - ROMANCE
        - FICCAO_CIENTIFICA
        - FANTASIA
        - TERROR
        - AVENTURA
        - BIOGRAFIA
        - HISTORIA
        - ACTION
        - SUSPENSE

    # === Schemas de Paginação ===
    BookPage:
      type: object
      properties:
        totalPages:
          type: integer
          description: "Número total de páginas."
        totalElements:
          type: integer
          format: int64
          description: "Número total de elementos."
        first:
          type: boolean
          description: "Indica se esta é a primeira página."
        last:
          type: boolean
          description: "Indica se esta é a última página."
        size:
          type: integer
          description: "O tamanho da página."
        content:
          type: array
          items:
            $ref: '#/components/schemas/BookResponse'
        number:
          type: integer
          description: "O número da página."
        sort:
          $ref: '#/components/schemas/SortObject'
        numberOfElements:
          type: integer
          description: "O número de elementos retornados na página."
        pageable:
          $ref: '#/components/schemas/PageableObject'
        empty:
          type: boolean
          description: "Indica se a página atual está vazia."

    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        sort:
          $ref: '#/components/schemas/SortObject'
        pageNumber:
          type: integer
        pageSize:
          type: integer
        paged:
          type: boolean
        unpaged:
          type: boolean

    SortObject:
      type: object
      properties:
        empty:
          type: boolean
        sorted:
          type: boolean
        unsorted:
          type: boolean

    # === Schema de Erro ===
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message
