logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web.client.RestTemplate: DEBUG

spring:
  application:
    name: Produtos Api
  datasource:
    url: jdbc:mysql://localhost:3306/cadastro_produtos?useTimezone=true&serverTimezone=UTC
    username: root
    password: '*124376*' # É uma boa prática colocar senhas e valores com caracteres especiais entre aspas
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}

  output:
    ansi:
      enabled: ALWAYS

server:
  port: 8080
  servlet:
    context-path: /api/v1

