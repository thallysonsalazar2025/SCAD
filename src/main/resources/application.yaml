spring:
  application:
    name: Produtos Api
  datasource:
    url: jdbc:mysql://localhost:3306/cadastro_produtos?useTimezone=true&serverTimezone=UTC
    username: root
    password: '*124376*' # É uma boa prática colocar senhas e valores com caracteres especiais entre aspas
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email # Escopos para obter informações básicas do usuário
      resourceserver:
        jwt:
          # Diz ao Resource Server (que protege /api/**) onde encontrar as chaves públicas
          # para validar os tokens JWT. A URL DEVE incluir o context-path.
          jwk-set-uri: http://localhost:8080/api/v1/oauth2/jwks
  output:
    ansi:
      enabled: ALWAYS

server:
  port: 8080
  servlet:
    context-path: /api/v1
