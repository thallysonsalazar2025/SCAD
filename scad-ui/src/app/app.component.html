<!-- LAYOUT DE LOGIN (Sem Sidebar) -->
<ng-container *ngIf="!showSidebar">
  <router-outlet></router-outlet>
</ng-container>

<!-- LAYOUT PRINCIPAL (Com Sidebar) -->
<div class="layout-container" *ngIf="showSidebar">

  <!-- MENU LATERAL -->
  <aside class="sidebar">
    <div class="brand">
      <img src="/assets/logo.jpeg" alt="" class="brand-logo">
    </div>

    <nav class="menu">
      <!-- Pesquisa -->
      <a routerLink="/pesquisar-livros" routerLinkActive="active" class="menu-item">
        <i class="material-icons">search</i>
        <span>Pesquisar Livros</span>
      </a>
      <a routerLink="/pesquisar-autor" routerLinkActive="active" class="menu-item">
        <i class="material-icons">person_search</i>
        <span>Pesquisar Autor</span>
      </a>

      <!-- Gestão -->
      <div class="menu-section" *ngIf="isManager">
        <button class="menu-header" (click)="toggleMenu('gestao')">
          <div style="display: flex; align-items: center;">
            <i class="material-icons icon-left">folder</i>
            <span>Gestão</span>
          </div>
          <i class="material-icons chevron" [class.rotate]="openMenu === 'gestao'">expand_more</i>
        </button>
        <div class="submenu" [class.open]="openMenu === 'gestao'">
          <a routerLink="/cadastro-livro" routerLinkActive="active" class="menu-item">
            <span>Cadastrar Livro</span>
          </a>
          <a routerLink="/cadastro-autor" routerLinkActive="active" class="menu-item">
            <span>Cadastrar Autor</span>
          </a>
          <a routerLink="/cadastro-cliente" routerLinkActive="active" class="menu-item">
            <span>Cadastrar Cliente</span>
          </a>
        </div>
      </div>

      <!-- Administração -->
      <div class="menu-section" *ngIf="isAdmin">
        <button class="menu-header" (click)="toggleMenu('admin')">
          <div style="display: flex; align-items: center;">
            <i class="material-icons icon-left">admin_panel_settings</i>
            <span>Administração</span>
          </div>
          <i class="material-icons chevron" [class.rotate]="openMenu === 'admin'">expand_more</i>
        </button>
        <div class="submenu" [class.open]="openMenu === 'admin'">
          <a routerLink="/cadastro-usuario" routerLinkActive="active" class="menu-item">
            <span>Cadastrar Usuário</span>
          </a>
        </div>
      </div>
    </nav>

    <div class="footer">
      <button (click)="logout()" class="btn-logout">
        <i class="material-icons">logout</i>
        <span>Sair</span>
      </button>
    </div>
  </aside>

  <!-- CONTEÚDO -->
  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
