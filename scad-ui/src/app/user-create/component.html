<div class="form-container">
    <h2>Novo Usuário</h2>

    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">

        <!-- Nome -->
        <div class="material-textfield">
            <input id="username" type="text" formControlName="username" placeholder=" ">
            <label for="username">Nome de Usuário</label>
        </div>

        <!-- Email -->
        <div class="material-textfield">
            <input id="email" type="email" formControlName="email" placeholder=" ">
            <label for="email">E-mail Corporativo</label>
        </div>

        <!-- Senha -->
        <div class="material-textfield">
            <input id="password" type="password" formControlName="password" placeholder=" ">
            <label for="password">Senha de Acesso</label>
        </div>

        <!-- Role -->
        <div class="material-textfield">
            <select id="role" formControlName="role">
                <option *ngFor="let role of roles" [value]="role.value">
                    {{ role.label }}
                </option>
            </select>
            <label for="role">Perfil de Acesso</label>
        </div>

        <!-- Mensagem -->
        <div *ngIf="message" class="message" [class.error]="message.includes('Erro')" [class.success]="!message.includes('Erro')">
            <i class="material-icons">{{ message.includes('Erro') ? 'error' : 'check_circle' }}</i>
            <span>{{ message }}</span>
        </div>

        <!-- Botão -->
        <button type="submit" class="btn-submit" [disabled]="userForm.invalid || isLoading">
            <i class="material-icons" style="margin-right: 8px;">save</i>
            {{ isLoading ? 'Salvando...' : 'Cadastrar Usuário' }}
        </button>

    </form>
</div>
