<div class="dashboard-container">

  <header class="page-header">
    <h1>Painel de Controle</h1>
    <p>Visão geral do sistema e atividades recentes.</p>
  </header>

  <!-- CARDS DE ESTATÍSTICAS -->
  <div class="stats-grid">
    <div class="stat-card" *ngFor="let stat of stats" [ngClass]="stat.color">
      <div class="icon-wrapper">
        <i class="material-icons">{{ stat.icon }}</i>
      </div>
      <div class="stat-info">
        <span class="stat-value">{{ stat.value }}</span>
        <span class="stat-title">{{ stat.title }}</span>
      </div>
    </div>
  </div>

  <div class="content-grid">

    <!-- AÇÕES RÁPIDAS -->
    <div class="card actions-card">
      <h3>Ações Rápidas</h3>
      <div class="actions-list">
        <a routerLink="/cadastro-livro" class="action-btn">
          <i class="material-icons">add_circle</i>
          Novo Livro
        </a>
        <a routerLink="/cadastro-cliente" class="action-btn">
          <i class="material-icons">person_add</i>
          Novo Cliente
        </a>
        <a routerLink="/pesquisar-livros" class="action-btn">
          <i class="material-icons">search</i>
          Pesquisar
        </a>
      </div>
    </div>

    <!-- ATIVIDADES RECENTES -->
    <div class="card activities-card">
      <h3>Atividades Recentes</h3>
      <ul class="activity-list">
        <li *ngFor="let activity of recentActivities">
          <div class="activity-icon">
            <i class="material-icons">history</i>
          </div>
          <div class="activity-details">
            <span class="activity-text"><strong>{{ activity.user }}</strong> {{ activity.action }}</span>
            <span class="activity-time">{{ activity.time }}</span>
          </div>
        </li>
      </ul>
    </div>

  </div>
</div>
