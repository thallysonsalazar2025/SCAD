services:
  app:
    build: .
    container_name: scad-app
    ports:
      - "8080:8080"
    environment:
      # Agora os valores são lidos do arquivo .env
      - URL_DATABASE=${URL_DATABASE}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - scad-network

  db:
    image: public.ecr.aws/docker/library/mysql:8.0
    container_name: scad-db
    ports:
      - "3307:3306"
    environment:
      - MYSQL_DATABASE=scad_db
      # Usa a mesma variável de senha para garantir que o Java consiga conectar
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - scad-network
    healthcheck:
      # O healthcheck também precisa saber a senha para testar a conexão
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build: ./scad-ui
    container_name: scad-ui
    ports:
      - "4200:80"
    depends_on:
      - app
    networks:
      - scad-network

volumes:
  db_data:

networks:
  scad-network: